# Merge into the active Hermes profile's config.yaml. Secrets belong in the
# profile's secret store, not here. Use `hermes github-mentions routes` to export
# the matching webhook routes with the profile's shared secret.
plugins:
  enabled:
    - hermes-github-mentions
  entries:
    hermes-github-mentions:
      settings:
        bot: example-bot
        allowed_authors: [example-owner]
        repositories: [owner/repo]
        # Run /github-mentions set in Discord to choose a channel, or override here.
        # discord_chat_id: "123456789012345678"
        webhook_url: http://127.0.0.1:8644/webhooks
        profile: default
        poll_seconds: 60
        progress: false

platforms:
  github_mentions:
    enabled: true

[project]
name = "hermes-github-mentions"
version = "0.4.3"
description = "Summon a self-hosted Hermes agent through GitHub mentions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
]

[project.scripts]
hermes-github-mentions = "hermes_github_mentions.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_github_mentions*"]
